global
  stats socket /var/run/haproxy/admin.sock mode 660 level admin
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h
  option http-keep-alive
  http-reuse never

frontend public
  bind :3000
  default_backend apps

backend apps
  # The controller changes the runtime map atomically. Existing keep-alive,
  # SSE and upgraded connections stay on their already selected destination;
  # HAProxy does not retry a request after this switch.
  http-request deny deny_status 503 unless { str(active),map_str_ip(/etc/haproxy/update/update.map) -m found }
  http-request set-dst str(active),map_str_ip(/etc/haproxy/update/update.map)
  http-request set-dst-port 3000
  server dynamic 0.0.0.0:3000
