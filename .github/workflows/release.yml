          {
            printf '## %s\n\n' "$current"
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            fi
            if [ -n "$previous" ]; then
              printf '### Changes since %s\n\n' "$previous"
            else
              printf '### Changes\n\n'
            fi
            if [ -n "$commits" ]; then
              printf '%s\n\n' "$commits"
