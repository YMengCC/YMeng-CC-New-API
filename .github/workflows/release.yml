name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft without publishing incomplete assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes 'Release assets are being verified.' \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

  linux:
    needs: prepare
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Every release must carry notes the in-app update dialog can render.
      # The body is derived deterministically from commits so the three platform
      # jobs write identical bytes and re-runs never duplicate content.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          current="$VERSION"
          # Pick the highest reachable release tag, not merely the nearest tag
          # in the first-parent walk: merges otherwise skip a release and make
          # the next release repeat the previous release notes.
          previous="$(git tag --merged "${current}^{commit}" --list 'v[0-9]*' \
                      --sort=-v:refname | grep -vx "$current" | sed -n '1p' || true)"
          # The release commit's own message describes the release; keep it as
          # the summary instead of dropping the commit as pure version churn.
          summary="$(git log -1 --format=%b "${current}^{commit}" | sed '/^Co-Authored-By:/d' || true)"
          commits="$(git log --no-merges -n 200 --format='- %s (%h)' "${previous:+${previous}..}${current}" \
                     | grep -vE '^- release: v?[0-9]' || true)"
          {
            printf '## %s\n\n' "$current"
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            fi
            if [ -n "$previous" ]; then
              printf '### Changes since %s\n\n' "$previous"
            else
              printf '### Changes\n\n'
            fi
            if [ -n "$commits" ]; then
              printf '%s\n\n' "$commits"
            elif [ -z "$summary" ]; then
              printf 'Release %s.\n\n' "$current"
            fi
            if [ -n "$previous" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous" "$current"
            fi
          } > release-notes.md
          test -s release-notes.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'new-api/common.Version=$VERSION' -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'new-api/common.Version=$VERSION' -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          body_path: release-notes.md
          files: |
            new-api-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: prepare
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Every release must carry notes the in-app update dialog can render.
      # The body is derived deterministically from commits so the three platform
      # jobs write identical bytes and re-runs never duplicate content.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          current="$VERSION"
          # Pick the highest reachable release tag, not merely the nearest tag
          # in the first-parent walk: merges otherwise skip a release and make
          # the next release repeat the previous release notes.
          previous="$(git tag --merged "${current}^{commit}" --list 'v[0-9]*' \
