          # The release commit's own message describes the release; keep it as
          # the summary instead of dropping the commit as pure version churn.
          summary="$(git log -1 --format=%b "${current}^{commit}" | sed '/^Co-Authored-By:/d' || true)"
          commits="$(git log --no-merges -n 200 --format='- %s (%h)' "${previous:+${previous}..}${current}" \
                     | grep -vE '^- release: v?[0-9]' || true)"
          {
            printf '## %s\n\n' "$current"
            if [ -n "$summary" ]; then
              printf '%s\n\n' "$summary"
            fi
            if [ -n "$previous" ]; then
              printf '### Changes since %s\n\n' "$previous"
            else
              printf '### Changes\n\n'
            fi
            if [ -n "$commits" ]; then
              printf '%s\n\n' "$commits"
            elif [ -z "$summary" ]; then
              printf 'Release %s.\n\n' "$current"
            fi
            if [ -n "$previous" ]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous" "$current"
            fi
          } > release-notes.md
          test -s release-notes.md
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build Backend
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-X 'new-api/common.Version=$VERSION' -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api-macos-$VERSION
      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          body_path: release-notes.md
          files: |
            new-api-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: prepare
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Every release must carry notes the in-app update dialog can render.
      # The body is derived deterministically from commits so the three platform
      # jobs write identical bytes and re-runs never duplicate content.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          current="$VERSION"
