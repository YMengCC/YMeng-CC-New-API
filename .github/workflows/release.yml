          # the summary instead of dropping the commit as pure version churn.
          summary="$(git log -1 --format=%b "${current}^{commit}" | sed '/^Co-Authored-By:/d' || true)"
          commits="$(git log --no-merges -n 200 --format='- %s (%h)' "${previous:+${previous}..}${current}" \
